 app.className=`prototype variant-${variant}`;
 app.innerHTML=`<aside class="rail"><div class="brand">${sphere(35)}</div><button class="icon-button rail-current" data-action="new" title="Новый диалог" aria-label="Новый диалог">${i('plus')}</button><button class="icon-button" data-action="history" title="История диалогов" aria-label="История диалогов">${i('chat-circle')}</button><button class="icon-button" data-action="instruction" title="Инструкция агента" aria-label="Инструкция агента">${i('file-text')}</button><div class="rail-spacer"></div><button class="icon-button" data-action="settings" title="Параметры" aria-label="Параметры">${i('sliders-horizontal')}</button><div class="avatar">ЮК</div></aside>${sidebarHistory()}<section class="workspace"><header class="app-header"><div class="breadcrumbs"><button class="icon-button header-history" data-action="history" title="История диалогов" aria-label="История диалогов">${i('list')}</button><span>Песочница</span>${i('caret-right')}<strong>Упаковщик оффера</strong></div><div class="header-actions"><span class="badge"><span class="dot"></span>Готов к проверке</span><button class="quiet" data-action="instruction" title="Инструкция">${i('file-text')}<span>Инструкция</span></button><button class="quiet" data-action="log" title="Журнал">${i('list')}<span>Журнал</span></button><button class="quiet" data-action="card" title="Карточка агента">${i('sliders-horizontal')}</button></div></header><div class="stage"><main class="chat"><div class="messages" id="messages" aria-live="polite"></div><div class="welcome"><div class="hero-sphere">${sphere(66)}</div><div class="eyebrow">${variant==='b'?'Рабочее пространство агента':'Песочница агента'}</div><h1>${variant==='b'?'Хороший оффер начинается<br>с разговора.':variant==='c'?'Проверим, как агент<br>ведёт разговор?':'С чего начнём проверку?'}</h1><p>${variant==='b'?'Побудьте на месте эксперта. Агент задаст вопросы и поможет собрать предложение.':'Напишите от лица эксперта. Здесь можно проверить вопросы агента и увидеть, как рождается оффер.'}</p><div class="composer-wrap"><div class="composer"><div class="attachment" id="attachment"></div><label class="visually-hidden" for="prompt">Сообщение агенту</label><textarea id="prompt" placeholder="Расскажите о своём продукте…" rows="2"></textarea><div class="composer-bottom"><div class="composer-left"><button class="icon-button" data-action="attach" title="Прикрепить файл" aria-label="Прикрепить файл">${i('plus')}</button></div><div class="composer-right"><button class="model-button" data-action="settings">GPT-6.1 Sol <span class="reason">· Высоко</span>${i('caret-down')}</button><button class="icon-button" data-action="mic" aria-label="Голосовой ввод" title="Голосовой ввод">${i('microphone')}</button><button class="send" id="send" data-action="send" aria-label="Отправить" disabled>${i('arrow-up')}</button></div></div></div><div class="composer-help">Тестовый диалог · не влияет на переписки экспертов</div></div><div class="suggestions"><button class="suggestion" data-prompt="Я создаю курс для экспертов, которые хотят запустить своё обучение.">${i('lightning')}Начать с идеи курса</button><button class="suggestion" data-prompt="У меня уже есть оффер. Хочу проверить, насколько он убедителен.">${i('file-text')}Проверить готовый оффер</button><button class="suggestion" data-prompt="Хочу собрать предложение для индивидуальных консультаций.">${i('chat-circle')}Предложить консультацию</button></div><div class="instruction-strip">${i('file-text')}<div><b>Инструкция агента</b><br>Вопросы → аудитория → обещание → оффер</div><button class="quiet" data-action="instruction">Посмотреть ${i('arrow-up-right')}</button></div></div><div class="context-footer">${i('folder-simple')}Упаковщик оффера<span style="opacity:.4">/</span>flow.json<button class="quiet" data-action="card">${i('gear-six')}</button></div></main><aside class="inspector" aria-label="Журнал диалога"><div class="inspector-head"><span>Журнал диалога</span><button class="icon-button close-inspector" data-action="log" aria-label="Закрыть журнал">${i('x')}</button></div><div class="inspector-tabs"><span>Все события</span><span>Вызовы модели</span></div><div class="empty-log" id="empty-log"><div class="log-symbol">${i('list')}</div><strong>Здесь будет ход диалога</strong><p>Запросы к модели, шаги агента и время ответа появятся после первого сообщения.</p></div><div class="log-events" id="log-events" hidden></div><div class="log-bottom"><span>Этапы · flow.json</span><span id="event-count">0 событий</span></div></aside></div></section>`;
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.variant===variant)));
 document.getElementById('description').innerHTML=`<span class="state-caption">${names[variant]} · состояния экрана</span><nav class="scene-switch" aria-label="Состояние диалога">${[['empty','Пустой экран'],['dialog','Диалог'],['working','Агент отвечает']].map(([id,label])=>`<button data-scene="${id}" aria-pressed="${scene===id}">${label}</button>`).join('')}</nav>`;
 const prompt=document.getElementById('prompt');prompt.value=message;updateInput();
 prompt.addEventListener('input',()=>{message=prompt.value;updateInput()});
 prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)send()}});
 renderScene();window.YKSphere?.scan(app);renderIcons();
}
async function renderIcons(){await Promise.all([...document.querySelectorAll('[data-icon]:not([data-loaded])')].map(async el=>{el.dataset.loaded='1';const name=el.dataset.icon;icons[name]??=fetch(`/sketches/icons/phosphor-regular/${name}.svg`).then(r=>r.text());el.innerHTML=await icons[name]}));document.body.dataset.ready='true'}
function updateInput(){const p=document.getElementById('prompt');p.style.height='auto';p.style.height=Math.min(160,Math.max(app.classList.contains('has-messages')?48:68,p.scrollHeight))+'px';document.getElementById('send').disabled=!busy&&!p.value.trim()}
function reset(){scene='empty';writeSceneUrl();message='';attachment='';render()}
function toast(text){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),3500)}
function closePopover(){document.querySelector('.popover')?.remove();document.querySelector('.instruction-overlay')?.remove()}
function popover(type,button){closePopover();const pop=document.createElement('section');pop.className='popover';pop.setAttribute('role','dialog');pop.setAttribute('aria-label',type==='instruction'?'Инструкция агента':type==='settings'?'Настройки ответа':'Карточка агента');const content=type==='instruction'?`<h2>Инструкция агента</h2><p>Вы — собеседник эксперта. Помогите сформулировать предложение через разговор.</p><p>Задавайте по одному вопросу. Выясните аудиторию, желаемый результат и опыт эксперта. Затем предложите формулировку оффера.</p><label>Последовательность</label><p>Знакомство → продукт → аудитория → результат → предложение</p>`:type==='settings'?`<h2>Настройки ответа</h2><label>Модель</label><select id="model-select"><option>GPT-6.1 Sol</option>Claude Sonnet</option>Gemini Flash</option></select><label>Рассуждения</label><select><option>Высоко</option><option>Средне</option><option>Низко</option></select><p>В этом макете выбор меняет подпись поля. Запросы к провайдерам не отправляются.</p><button class="quiet" data-action="save-settings">Применить</button>`:`<h2>Упаковщик оффера</h2><p>Агент помогает экспертам собрать предложение для курса, консультации или программы.</p><label>Сценарий</label><p>flow.json · 5 этапов</p><label>Режим</label><p>Песочница · тестовый диалог</p>`;pop.innerHTML=`<button class="icon-button close-pop" data-action="close-pop" aria-label="Закрыть">${i('x')}</button>${content}`;document.body.append(pop);const rect=button.getBoundingClientRect();pop.style.top=Math.min(rect.bottom+10,innerHeight-pop.offsetHeight-20)+'px';pop.style.left=Math.max(16,Math.min(rect.right-pop.offsetWidth,innerWidth-pop.offsetWidth-20))+'px';renderIcons();pop.querySelector('select,button')?.focus()}
function send(){sendDemoMessage()}
document.addEventListener('click',e=>{const stateButton=e.target.closest('[data-scene]');if(stateButton){scene=stateButton.dataset.scene;message='';writeSceneUrl();render();return}const filter=e.target.closest('[data-log-filter]');if(filter){filterLog(filter.dataset.logFilter);return}const v=e.target.closest('[data-variant]');if(v){variant=v.dataset.variant;const url=new URL(location);url.searchParams.set('v',variant);window.history.replaceState(null,'',url);render();return}const choice=e.target.closest('[data-prompt]');if(choice){const p=document.getElementById('prompt');p.value=choice.dataset.prompt;message=p.value;updateInput();p.focus();return}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'log':if(variant==='c'){if(innerWidth<=700){app.classList.toggle('drawer-open');app.classList.remove('log-hidden')}else app.classList.toggle('log-hidden')}else app.classList.toggle('drawer-open');break;case'history':if(variant==='b'&&innerWidth>700)app.classList.toggle('history-hidden');else app.classList.toggle('history-open');break;case'new':reset();break;case'past':document.getElementById('prompt').value='Продолжим проверку оффера для курса экспертов.';updateInput();toast('Пример предыдущего диалога. Отправьте сообщение, чтобы продолжить.');break;case'instruction':case'settings':case'card':popover(b.dataset.action,b);break;case'close-pop':closePopover();break;case'save-settings':const m=document.getElementById('model-select').value;document.querySelector('.model-button').innerHTML=m+' '+i('caret-down');closePopover();renderIcons();break;case'attach':attachment='Бриф эксперта.pdf';document.getElementById('attachment').textContent=attachment+' · пример вложения';document.getElementById('attachment').classList.add('visible');toast('В макет добавлен пример файла');break;case'mic':toast('Это макет: микрофон не записывает звук');break;case'send':if(busy)stopDemoReply();else send();break;case'copy':navigator.clipboard?.writeText(b.closest('.agent-answer').querySelector('.answer-content').innerText).then(()=>toast('Ответ скопирован'));break;case'like':toast('Оценка отмечена в макете');break;case'demo-note':toast('Это демонстрация интерфейса, ответ задан в макете');break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopover();app.classList.remove('drawer-open','history-open');document.body.classList.remove('only-app')}});
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};
document.getElementById('fullscreen').onclick=()=>{document.body.classList.toggle('only-app');toast('Esc — вернуться к выбору вариантов')};
if(new URLSearchParams(location.search).get('app')==='1')document.body.classList.add('only-app');
render();
</script>
