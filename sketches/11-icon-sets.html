<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Набросок 11 — набор значков</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 14px; }
  .page { max-width: 1280px; margin: 0 auto; padding: 36px 36px 60px; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 28px; }
  .page-head h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.025em; margin-top: 6px; }
  .page-head button { margin-left: auto; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .sets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

  .set { border: 1px solid var(--border); border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .set header h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .set header p { font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 6px; }

  .ic { display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none; }
  .ic svg { width: 100%; height: 100%; display: block; }
  .ic.s16 { width: 16px; height: 16px; }
  .ic.s24 { width: 24px; height: 24px; }
  /* Линейные наборы тоньше стандартных 2px — под характер «Чертежа» */
  .set.stroke svg { stroke-width: 1.5; }

  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; color: var(--text); }
  .grid span { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; }
  .grid span:hover { background: var(--surface-2); }

  .context { display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); border-radius: var(--r-lg); padding: 14px; }
  .context .mono-label { font-size: 10px; }

  .tabbar { display: flex; justify-content: space-around; background: var(--surface); border-radius: 12px; padding: 8px 4px 6px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tab .pill { padding: 3px 14px; border-radius: 8px; }
  .tab.on { color: var(--accent-text); }
  .tab.on .pill { background: var(--accent-soft); }

  .composer { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 10px 8px 8px 12px; display: flex; flex-direction: column; gap: 6px; }
  .composer .text { color: var(--faint); font-size: 14px; }
  .composer .bar { display: flex; align-items: center; gap: 4px; }
  .tool { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .tool:first-child { margin-left: -7px; }
  .ctx { height: 22px; display: inline-flex; align-items: center; font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; }
  .send { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; }

  .answer { background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.45; }
  .reactions { display: flex; gap: 2px; margin-left: -6px; color: var(--muted); }
  .reactions span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; }

  .list { background: var(--surface); border-radius: 12px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 13.5px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .box { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--text); }
  .row .grow { flex: 1; }
  .row .chev { color: var(--faint); }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; border-top: 1px solid var(--border); padding-top: 14px; }
  .facts span:nth-child(odd) { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <div><div class="mono-label">YKDesignSystem · набросок 11</div><h1>Набор значков</h1></div>
    <button onclick="document.body.classList.toggle('theme-dark')">◐ Тема</button>
  </div>
  <div class="sets" id="sets"></div>
</div>

<template id="set">
  <section class="set">
    <header><span class="mono-label"></span><h2></h2><p></p></header>
    <div class="grid"></div>
    <div class="context">
      <span class="mono-label">Вкладки</span>
      <div class="tabbar">
        <div class="tab on"><span class="pill" data-i="home"></span>Главная</div>
        <div class="tab"><span class="pill" data-i="chat"></span>Чат</div>
        <div class="tab"><span class="pill" data-i="folder"></span>Проекты</div>
        <div class="tab"><span class="pill" data-i="settings"></span>Ещё</div>
      </div>
      <span class="mono-label">Поле ввода</span>
      <div class="composer"><div class="text">Спросить агента…</div><div class="bar"><span class="tool" data-i="plus"></span><span class="ctx">@ Мастерская</span><span class="tool" data-i="mic"></span><span class="send" data-i="send" data-s="16"></span></div></div>
      <span class="mono-label">Ответ агента</span>
      <div class="answer">Все 5 писем готовы и проверены.<div class="reactions"><span data-i="copy" data-s="16"></span><span data-i="retry" data-s="16"></span><span data-i="like" data-s="16"></span><span data-i="dislike" data-s="16"></span></div></div>
      <span class="mono-label">Список</span>
      <div class="list">
        <div class="row"><span class="box" data-i="file" data-s="16"></span><span class="grow">План рассылки.md</span><span class="chev" data-i="next" data-s="16"></span></div>
        <div class="row"><span class="box" data-i="calendar" data-s="16"></span><span class="grow">Расписание эфиров</span><span class="chev" data-i="next" data-s="16"></span></div>
      </div>
    </div>
    <div class="facts"></div>
  </section>
</template>

<script>
  const ICONS = ['home','folder','chat','search','plus','mic','send','copy','retry','like','dislike','settings','file','calendar','check','more','next','back','agent','trash','bell','user','attach','menu'];
  const SETS = [
    { key: 'lucide', label: '01', name: 'Lucide', stroke: true,
      note: 'Линии, ровные и строгие. Самый распространённый открытый набор в вебе.',
      facts: [['Веб', 'Официальный пакет для React'], ['iPhone', 'Есть пакеты для SwiftUI от сообщества, не официальные'], ['Значков', 'около 1 600'], ['Толщины', 'любая, линию можно сделать тоньше'], ['Риск', 'стоит по умолчанию во многих шаблонах — «как у всех»']] },
    { key: 'phosphor', label: '02', name: 'Phosphor', stroke: false,
      note: 'Линии чуть мягче, формы более «дружелюбные». Шесть начертаний: от тонкого до залитого.',
      facts: [['Веб', 'Официальный пакет для React'], ['iPhone', 'Официальный пакет для SwiftUI от тех же авторов'], ['Значков', 'около 1 500 в каждом начертании'], ['Толщины', '6 начертаний, включая залитое для активной вкладки'], ['Риск', 'формы мягче, чем строгий «Чертёж»']] },
    { key: 'tabler', label: '03', name: 'Tabler', stroke: true,
      note: 'Линии, самые геометричные и «инженерные» из трёх. Огромный выбор.',
      facts: [['Веб', 'Официальный пакет для React'], ['iPhone', 'Официального пакета нет — значки придётся выгружать вручную'], ['Значков', 'больше 5 000'], ['Толщины', 'любая, линию можно сделать тоньше'], ['Риск', 'на iPhone больше ручной работы при каждом обновлении']] },
  ];

  const cache = {};
  async function svgOf(set, name) {
    const key = `${set}/${name}`;
    if (!cache[key]) cache[key] = fetch(`icons/${key}.svg`).then((r) => r.text()).then((t) => t.replace(/<!--[\s\S]*?-->/g, ''));
    return cache[key];
  }
  async function iconEl(set, name, size) {
    const span = document.createElement('span');
    span.className = 'ic' + (size ? ` s${size}` : '');
    span.innerHTML = await svgOf(set, name);
    return span;
  }

  (async () => {
    const holder = document.getElementById('sets');
    for (const set of SETS) {
      const node = document.getElementById('set').content.cloneNode(true);
      const section = node.querySelector('.set');
      if (set.stroke) section.classList.add('stroke');
      section.querySelector('header .mono-label').textContent = set.label;
      section.querySelector('h2').textContent = set.name;
      section.querySelector('header p').textContent = set.note;
      const grid = section.querySelector('.grid');
      for (const name of ICONS) { const cell = document.createElement('span'); cell.title = name; cell.appendChild(await iconEl(set.key, name)); grid.appendChild(cell); }
      for (const slot of section.querySelectorAll('[data-i]')) slot.appendChild(await iconEl(set.key, slot.dataset.i, slot.dataset.s));
      section.querySelector('.facts').innerHTML = set.facts.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('');
      holder.appendChild(section);
    }
    document.body.dataset.ready = '1';
  })();
</script>
</body>
</html>
